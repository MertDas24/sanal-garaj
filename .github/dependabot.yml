# Bağımlılık ve GitHub Actions güncellemeleri için haftalık otomatik PR
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uretim:
        dependency-type: production
      gelistirme:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
